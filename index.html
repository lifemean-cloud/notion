<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단일 레이아웃 할 일 위젯</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: transparent; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            font-size: 13px; 
        }
        
        .todo-container { 
            padding: 12px; box-sizing: border-box; width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            background-color: #08d6c4; 
            border-radius: 10px; 
        }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 6px; margin-bottom: 10px; flex-shrink: 0; }
        h2 { margin: 0; font-size: 1rem; font-weight: 600; color: #ffffff; }
        
        .title-link {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .title-link:hover { opacity: 0.7; }

        .list-wrapper { flex: 1; overflow-y: auto; overflow-x: hidden; }
        ul { list-style: none; padding: 0; margin: 0; margin-bottom: 12px; }
        li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.2); transition: opacity 0.2s; }
        li:last-child { border-bottom: none; }
        
        .todo-main-row { display: flex; flex-direction: row; align-items: center; width: 100%; gap: 8px; }

        .todo-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #333;
            flex-shrink: 0;
            margin: 0;
        }

        .todo-text-input { 
            flex: 1; 
            background: transparent !important; 
            color: #ffffff !important; 
            border: none; 
            outline: none; 
            font-family: inherit; 
            font-size: 0.9rem;
            font-weight: 500;
            padding: 2px;
            min-width: 50px;
        }
        .todo-text-input::placeholder { color: rgba(255,255,255,0.5); }
        
        /* 중요도 박스 정사각형 적용 */
        select { 
            appearance: none; 
            -webkit-appearance: none; 
            -moz-appearance: none; 
            background: rgba(0,0,0,0.15); 
            border: none; 
            color: #ffffff; 
            border-radius: 4px; 
            width: 26px; /* 높이와 동일한 26px 고정 */
            height: 26px; /* 가로와 동일한 26px 고정 */
            padding: 0; /* 패딩 제거하여 크기 변형 방지 */
            font-size: 0.8rem;
            outline: none; 
            cursor: pointer;
            text-align: center;
            text-align-last: center; 
        }
        select option { background-color: #333; color: #fff; }

        .date-edit-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .date-wrapper { position: relative; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
        .date-icon { display: flex; align-items: center; justify-content: center; pointer-events: none; color: rgba(255,255,255,0.9); }
        .inline-date { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; 
            cursor: pointer; outline: none; border: none; padding: 0; margin: 0;
        }
        
        .date-separator { font-size: 0.8rem; color: rgba(255,255,255,0.8); }
        .is-loading { opacity: 0.5; pointer-events: none; }

        .add-todo-row { display: flex; align-items: center; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; gap: 6px; }
        .add-input { flex: 1; padding: 6px 8px; border: none; border-radius: 4px; background: rgba(0,0,0,0.15); color: #fff; font-size: 0.85rem; outline: none; }
        .add-input::placeholder { color: rgba(255,255,255,0.6); }
        .add-btn { padding: 6px 12px; background-color: rgba(0,0,0,0.25); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background-color 0.2s; }
        .add-btn:hover { background-color: rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div class="todo-container">
        <div class="header-row">
            <h2><a href="https://app.notion.com/p/lifemean/28d0d295354b8077b588f3f88b7a2e6a" target="_blank" class="title-link">진행 중인 할 일 목록</a></h2>
        </div>
        
        <div class="list-wrapper">
            <ul id="todo-list">
                <li>데이터를 불러오는 중입니다...</li>
            </ul>
        </div>

        <div class="add-todo-row">
            <input type="text" id="new-todo-input" class="add-input" placeholder="새 할 일 입력 (엔터)" onkeypress="handleEnter(event)">
            <button id="add-btn" class="add-btn" onclick="addTodo()">추가</button>
        </div>
    </div>

    <script>
        const BACKEND_API_URL = 'https://notion-one-alpha.vercel.app/api';

        const simpleCalendarSVG = `
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        `;

        function getKSTDateString() {
            const kstDate = new Date(Date.now() + 9 * 60 * 60 * 1000);
            return kstDate.toISOString().split('T')[0];
        }

        async function fetchTodos() {
            const listElement = document.getElementById('todo-list');
            listElement.innerHTML = '<li>로딩 중...</li>';
            
            try {
                const response = await fetch(BACKEND_API_URL);
                const result = await response.json();
                
                listElement.innerHTML = '';

                if (!result.success) {
                    listElement.innerHTML = '<li>통신 실패</li>';
                    return;
                }
                if (result.data.length === 0) {
                    listElement.innerHTML = '<li>진행 중인 일정이 없습니다.</li>';
                    return;
                }

                result.data.forEach(todo => {
                    const li = document.createElement('li');
                    li.id = `todo-${todo.id}`;
                    
                    li.innerHTML = `
                        <div class="todo-main-row">
                            <input type="checkbox" class="todo-checkbox" onchange="updateProperty('${todo.id}', '완료', this.checked, this)" ${todo.completed ? 'checked' : ''} title="완료 처리">
                            
                            <input type="text" class="todo-text-input" value="${todo.title}" onblur="updateProperty('${todo.id}', '할일', this.value, this)" placeholder="할 일">

                            <select onchange="updateProperty('${todo.id}', '중요도', this.value, this)">
                                <option value="상" ${todo.importance === '상' ? 'selected' : ''}>상</option>
                                <option value="중" ${todo.importance === '중' ? 'selected' : ''}>중</option>
                                <option value="하" ${todo.importance === '하' ? 'selected' : ''}>하</option>
                            </select>
                            
                            <div class="date-edit-group">
                                <div class="date-wrapper" title="시작일">
                                    <span class="date-icon">${simpleCalendarSVG}</span>
                                    <input type="date" class="inline-date date-start" value="${todo.dateStart || ''}" onchange="updateDate('${todo.id}', this)">
                                </div>
                                <span class="date-separator">~</span>
                                <div class="date-wrapper" title="종료일">
                                    <span class="date-icon">${simpleCalendarSVG}</span>
                                    <input type="date" class="inline-date date-end" value="${todo.dateEnd || ''}" onchange="updateDate('${todo.id}', this)">
                                </div>
                            </div>
                        </div>
                    `;
                    listElement.appendChild(li);
                });
            } catch (error) {
                listElement.innerHTML = '<li>오류 발생</li>';
            }
        }

        async function updateProperty(pageId, propertyName, newValue, element) {
            const li = element.closest('li');
            
            let previousValue = element.getAttribute('data-prev-value');
            if (previousValue === null) {
                if (element.type === 'checkbox') previousValue = element.defaultChecked;
                else previousValue = element.defaultValue || element.querySelector?.('option[selected]')?.value;
            }
            
            if (propertyName === '할일' && newValue.trim() === '') {
                alert('할 일 내용은 비워둘 수 없습니다.');
                element.value = previousValue;
                return;
            }

            li.classList.add('is-loading');

            try {
                const response = await fetch(BACKEND_API_URL, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pageId, propertyName, newValue })
                });

                const result = await response.json();
                if (result.success) {
                    element.setAttribute('data-prev-value', newValue);
                    
                    if (propertyName === '완료' && newValue === true) {
                        li.remove();
                    }
                } else {
                    throw new Error();
                }
            } catch (error) {
                if (element.type === 'checkbox') element.checked = previousValue === 'true' || previousValue === true;
                else element.value = previousValue;
            } finally {
                if (document.body.contains(li)) li.classList.remove('is-loading');
            }
        }

        async function updateDate(pageId, element) {
            const li = element.closest('li');
            const startInput = li.querySelector('.date-start');
            const endInput = li.querySelector('.date-end');
            
            let startVal = startInput.value;
            let endVal = endInput.value;
            
            if (endVal && !startVal) {
                alert("시작일을 먼저 입력해야 합니다.");
                endInput.value = ''; 
                return;
            }

            li.classList.add('is-loading');

            try {
                await fetch(BACKEND_API_URL, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pageId: pageId,
                        propertyName: '날짜',
                        newValue: { start: startVal, end: endVal || null }
                    })
                });
            } catch (error) {
                alert('날짜 업데이트에 실패했습니다.');
            } finally {
                if (document.body.contains(li)) li.classList.remove('is-loading');
            }
        }

        function handleEnter(event) { if (event.key === 'Enter') addTodo(); }

        async function addTodo() {
            const inputElement = document.getElementById('new-todo-input');
            const btnElement = document.getElementById('add-btn');
            const title = inputElement.value.trim();
            const targetDate = getKSTDateString(); 

            if (!title) return;

            inputElement.disabled = true;
            btnElement.disabled = true;

            try {
                await fetch(BACKEND_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, targetDate })
                });
                inputElement.value = ''; 
                fetchTodos(); 
            } finally {
                inputElement.disabled = false;
                btnElement.disabled = false;
                inputElement.focus();
            }
        }

        fetchTodos();
    </script>
</body>
</html>
