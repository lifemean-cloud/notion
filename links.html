<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 0px; background: transparent; overflow-y: auto; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: #cdd2d6; border-radius: 3px; }
    
    /* 전체 위젯 간격 축소 (24px -> 16px) */
    .widget-container { display: flex; flex-direction: column; gap: 16px; width: 100%; box-sizing: border-box; }
    
    /* 카테고리 내부 여백 및 간격 축소 */
    .category-group { 
        display: flex; 
        flex-direction: column; 
        gap: 8px; /* 12px -> 8px */
        width: 100%; 
        background-color: #f1f3f5; 
        padding: 12px; /* 15px -> 12px */
        border-radius: 10px; 
        box-sizing: border-box; 
    }
    
    .category-title { 
        font-size: 16px; 
        font-weight: 800; 
        color: #222; 
        margin: 0; 
        padding-bottom: 2px; 
    }
    
    /* 링크 카드 배열 간격 축소 */
    .links-row { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
        gap: 8px; /* 12px -> 8px */
        align-items: start; 
    }
    
    /* 링크 박스(카드) 자체의 내부 여백 축소 */
    .link-wrapper { 
        display: flex; 
        flex-direction: column; 
        gap: 2px; /* 4px -> 2px */
        background: #f8f9fa; 
        padding: 4px; /* 6px -> 4px */
        border-radius: 6px; 
        border: 1px solid #e9ecef; 
        width: 100%; 
        box-sizing: border-box; 
    }
    .link-header { display: flex; align-items: center; gap: 4px; }
    
    /* 메인 버튼의 위아래 여백 축소 */
    .link-btn { flex: 1; display: flex; align-items: center; gap: 8px; padding: 5px 8px; /* 8px 10px -> 5px 8px */ background-color: #08d6c4; color: #ffffff; text-decoration: none; border-radius: 5px; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color 0.2s ease, filter 0.2s ease; }
    .link-btn:hover { background-color: #00a4ec; color: #222222; filter: brightness(0.9); }
    .link-btn img { width: 16px; height: 16px; /* 18px -> 16px */ border-radius: 4px; object-fit: cover; flex-shrink: 0; background: transparent; }

    .link-wrapper:nth-child(3n+2) .link-btn { background-color: #07bbab; }
    .link-wrapper:nth-child(3n) .link-btn { background-color: #07a799; }

    /* 우측 토글 버튼의 최소 높이 축소 (메인 버튼 크기에 맞춤) */
    .toggle-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 100%; min-height: 26px; /* 34px -> 26px */ background-color: #e9ecef; color: #555; border: none; border-radius: 5px; cursor: pointer; font-size: 10px; transition: background-color 0.2s; }
    .toggle-btn:hover { background-color: #dee2e6; color: #000; }

    .auth-container { display: none; flex-direction: column; gap: 2px; padding: 4px; background: #ffffff; border-radius: 4px; border: 1px solid #e2e6ea; margin-top: 2px; }
    .edit-container { display: flex; align-items: center; font-size: 11px; color: #555; }
    .auth-label { font-weight: 600; width: 25px; color: #888; }

    .text-view { flex: 1; cursor: pointer; padding: 2px 4px; border-radius: 3px; background: #fff; border: 1px dashed #ccc; min-height: 14px; transition: background 0.2s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-view:hover { background: #e2e6ea; border-color: #999; }
    .text-input { flex: 1; font-size: 11px; padding: 1px 4px; border: 1px solid #08d6c4; border-radius: 3px; outline: none; width: 100%; box-sizing: border-box; }
    
    .is-loading { opacity: 0.5; pointer-events: none; }
</style>
