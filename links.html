<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 10px; background: transparent; }
    
    /* 전체 위젯을 위에서 아래로(수직) 배치하는 컨테이너 */
    .widget-container { display: flex; flex-direction: column; gap: 24px; width: 100%; box-sizing: border-box; }
    
    /* 변경 후 (덮어쓰기) */
	.category-group { 
		display: flex; 
		flex-direction: column; 
		gap: 12px; 
		width: 100%; 
		background-color: #f1f3f5; /* 연한 회색 배경 */
		padding: 16px; /* 박스 안쪽 여백 */
		border-radius: 10px; /* 요구하신 모서리 라운드 */
		box-sizing: border-box; 
	}
    
    /* 변경 후 (덮어쓰기) */
	.category-title { 
		font-size: 16px; 
		font-weight: 800; 
		color: #222; 
		margin: 0; 
		padding-bottom: 2px; 
	}
    
    /* 변경된 코드 (align-items: flex-start; 추가) */
	.links-row { display: flex; flex-direction: row; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    
    /* 개별 링크 카드 크기 고정 (가로 배치 시 일관성을 위해 넓이 제한) */
    .link-wrapper { width: 190px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; background: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #e9ecef; }
    .link-header { display: flex; align-items: center; gap: 4px; }
    
    .link-btn { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background-color: #08d6c4; color: #ffffff; text-decoration: none; border-radius: 5px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color 0.2s ease, filter 0.2s ease; }
    .link-btn:hover { background-color: #00a4ec; color: #222222; filter: brightness(0.9); }
    .link-btn img { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #fff; }

    .toggle-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 100%; min-height: 34px; background-color: #e9ecef; color: #555; border: none; border-radius: 5px; cursor: pointer; font-size: 10px; transition: background-color 0.2s; }
    .toggle-btn:hover { background-color: #dee2e6; color: #000; }

    .auth-container { display: none; flex-direction: column; gap: 2px; padding: 4px; background: #ffffff; border-radius: 4px; border: 1px solid #e2e6ea; margin-top: 2px; }
    .edit-container { display: flex; align-items: center; font-size: 11px; color: #555; }
    .auth-label { font-weight: 600; width: 25px; color: #888; }

    .text-view { flex: 1; cursor: pointer; padding: 2px 4px; border-radius: 3px; background: #fff; border: 1px dashed #ccc; min-height: 14px; transition: background 0.2s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-view:hover { background: #e2e6ea; border-color: #999; }
    .text-input { flex: 1; font-size: 11px; padding: 1px 4px; border: 1px solid #08d6c4; border-radius: 3px; outline: none; width: 100%; box-sizing: border-box; }
    
    .is-loading { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>

    <div class="widget-container" id="widget-container">
        <div style="padding: 10px; color: #666;">데이터베이스에서 링크 정보를 불러오는 중입니다...</div>
    </div>

<script>
    // 백엔드 API 주소 유지
    const BACKEND_API_URL = 'https://notion-one-alpha.vercel.app/api/links';

    // 1. 요청하신 6개의 카테고리로 배열 전면 수정
    const groups = ['생명보험', '손해보험', '기타보험', 'SNS', 'AI', '기타'];

    async function fetchLinks() {
        const container = document.getElementById('widget-container');
        
        try {
            const response = await fetch(BACKEND_API_URL);
            const result = await response.json();
            
            if (!result.success) throw new Error();

            container.innerHTML = ''; 

            groups.forEach(groupName => {
                const groupData = result.data.filter(item => item.group === groupName);
                
                // 해당 그룹에 등록된 링크가 단 1개도 없다면, 카테고리 자체를 화면에 그리지 않고 스킵 (공간 낭비 방지)
                if (groupData.length === 0) return;

                // 카테고리 컨테이너 생성
                const groupCol = document.createElement('div');
                groupCol.className = 'category-group';
                
                // 2. 제목 추가 (상단 배치)
                const titleHtml = `<h3 class="category-title">${groupName}</h3>`;
                groupCol.insertAdjacentHTML('beforeend', titleHtml);
                
                // 3. 링크들을 담을 가로형 컨테이너(Row) 생성
                const linksRow = document.createElement('div');
                linksRow.className = 'links-row';

                groupData.forEach(link => {
                    const idText = link.userId ? link.userId : '더블클릭';
                    const pwText = link.userPw ? link.userPw : '더블클릭';

                    // 자동 파비콘 추출 로직
                    let finalIcon = link.icon;
                    if (!finalIcon || finalIcon.includes('domain=google.com')) {
                        try {
                            const domain = new URL(link.url).hostname; 
                            finalIcon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                        } catch (e) {
                            finalIcon = 'https://www.google.com/s2/favicons?domain=google.com&sz=64';
                        }
                    }

                    const linkHtml = `
                        <div class="link-wrapper" id="wrap-${link.id}">
                            <div class="link-header">
                                <a href="${link.url}" target="_blank" class="link-btn" title="${link.name}">
                                    <img src="${finalIcon}" alt="ico">${link.name}
                                </a>
                                <button class="toggle-btn" onclick="toggleAuth(this)">▼</button>
                            </div>
                            <div class="auth-container">
                                <div class="edit-container">
                                    <span class="auth-label">ID</span>
                                    <span class="text-view" ondblclick="toEdit(this)">${idText}</span>
                                    <input type="text" class="text-input" style="display:none;" onblur="saveData(this, '${link.id}', '아이디')" onkeydown="onKey(event, this)">
                                </div>
                                <div class="edit-container">
                                    <span class="auth-label">PW</span>
                                    <span class="text-view" ondblclick="toEdit(this)">${pwText}</span>
                                    <input type="text" class="text-input" style="display:none;" onblur="saveData(this, '${link.id}', '비밀번호')" onkeydown="onKey(event, this)">
                                </div>
                            </div>
                        </div>
                    `;
                    linksRow.insertAdjacentHTML('beforeend', linkHtml);
                });
                
                // 행(Row)을 그룹에 넣고, 그룹을 메인 컨테이너에 삽입
                groupCol.appendChild(linksRow);
                container.appendChild(groupCol);
            });

        } catch (error) {
            container.innerHTML = '<div style="color:red; padding: 10px;">데이터를 불러오지 못했습니다. Vercel 환경변수 및 주소를 확인하세요.</div>';
        }
    }

    function toggleAuth(btnElement) {
        const wrapper = btnElement.closest('.link-wrapper');
        const authContainer = wrapper.querySelector('.auth-container');
        if (authContainer.style.display === 'none' || authContainer.style.display === '') {
            authContainer.style.display = 'flex'; 
            btnElement.innerText = '▲'; 
        } else {
            authContainer.style.display = 'none'; 
            btnElement.innerText = '▼';
        }
    }

    function toEdit(element) {
        const input = element.nextElementSibling;
        const currentText = element.innerText;
        
        input.value = currentText === '더블클릭' ? '' : currentText;
        input.dataset.original = currentText; 

        element.style.display = 'none';
        input.style.display = 'inline-block';
        input.focus();
    }

    async function saveData(input, pageId, propertyName) {
        const view = input.previousElementSibling;
        const newValue = input.value.trim();
        const originalValue = input.dataset.original;
        
        if (newValue === (originalValue === '더블클릭' ? '' : originalValue)) {
            view.innerText = originalValue;
            input.style.display = 'none';
            view.style.display = 'inline-block';
            return;
        }

        const wrapper = input.closest('.link-wrapper');
        wrapper.classList.add('is-loading'); 

        try {
            const response = await fetch(BACKEND_API_URL, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pageId: pageId, propertyName: propertyName, newValue: newValue })
            });

            const result = await response.json();
            
            if (result.success) {
                view.innerText = newValue !== '' ? newValue : '더블클릭';
            } else {
                throw new Error();
            }
        } catch (error) {
            alert('저장에 실패했습니다. 네트워크를 확인하세요.');
            view.innerText = originalValue; 
        } finally {
            wrapper.classList.remove('is-loading');
            input.style.display = 'none';
            view.style.display = 'inline-block';
        }
    }

    function onKey(e, input) {
        if (e.key === 'Enter') {
            input.blur(); 
        }
    }

    fetchLinks();
    setInterval(fetchLinks, 300000);
</script>
</body>
</html>
